<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CertFlow｜新人資格取得・費用申請管理ツール</title>
  <!-- デザイン（css/style.css）を読み込み -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!--
    共通ヘッダー
    役割切替ボタン（新入社員／上司）とサンプルデータ初期化ボタンを
    js/app.js が「header-actions」の中に描画する。
  -->
  <header class="header">
    <div class="header-brand">
      <h1>CertFlow</h1>
      <p class="header-caption">新人資格取得・費用申請管理ツール</p>
    </div>
    <div class="header-actions" id="header-actions"></div>
  </header>

  <!--
    画面ナビゲーション
    現在の役割に合う画面リンクを js/app.js が「app-nav」に描画する。
  -->
  <nav class="nav" id="app-nav"></nav>

  <!-- 各画面の内容を描画する場所 -->
  <main class="content" id="app-content"></main>

  <footer class="footer">
    <p>
      本アプリは架空の会社制度を例にした学習用デモです。
      実際のログイン・メール送信・振込・ファイルアップロードの機能はありません。
    </p>
  </footer>

  <!--
    読み込み順が大事：
      data.js（データ層）→ app.js（画面制御）→
      stage2.js（第2段階）→ stage3.js（第3段階）→
      stage4.js（第4段階）→ stage5.js（第5段階）
    ※サーバーなしでHTMLを直接開いても動くよう、通常の script タグで読み込む。
  -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/stage2.js"></script>
  <script src="js/stage3.js"></script>
  <script src="js/stage4.js"></script>
  <script src="js/stage5.js"></script>
</body>
</html>
